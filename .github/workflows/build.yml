name: Build, Clippy and Format

permissions:
  contents: write

on: [push, pull_request]

jobs:
  clippy_fmt:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64, riscv64]
    steps:
    - uses: actions/checkout@v2
    - uses: actions-rs/toolchain@v1
      with:
        profile: minimal
        toolchain: nightly-2022-11-03
        override: true
        components: rust-src, clippy, rustfmt
    - name: Clippy kernel
      run: make -C kernel clippy ARCH=${{ matrix.arch }}
    - name: Clippy user
      run: make -C user/rust clippy ARCH=${{ matrix.arch }}
    - name: Check code format in kernel
      run: cargo fmt --all --manifest-path=kernel/Cargo.toml -- --check
    - name: Check code format in user
      run: cargo fmt --all --manifest-path=user/rust/Cargo.toml -- --check

  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64, riscv64]
        usertests: [false, true]
        gicv3: [false, true]
        exclude:
          - arch: x86_64
            gicv3: true
          - arch: riscv64
            gicv3: true
    env:
      ZIP_NAME: ${{ matrix.arch }}${{ matrix.usertests && '_usertests' || '' }}${{ matrix.gicv3 && '_gicv3' || '' }}.zip
      USER_ENTRY: ${{ matrix.usertests && 'usertests' || 'user_shell' }}
      GICV3: ${{ matrix.gicv3 && 'on' || 'off' }}
    steps:
    - uses: actions/checkout@v2
    - uses: actions-rs/toolchain@v1
      with:
        profile: minimal
        toolchain: nightly-2022-02-22
        components: rust-src, llvm-tools-preview
    - name: Setup environment
      run: make -C kernel env ARCH=${{ matrix.arch }}
    - name: Install musl toolchain
      run: |
        if [ "${{ matrix.arch }}" = "x86_64" ]; then
          export MUSL_PATH="x86_64-linux-musl-cross"
        elif [ "${{ matrix.arch }}" = "aarch64" ]; then
          export MUSL_PATH="aarch64-linux-musl-cross"
        elif [ "${{ matrix.arch }}" = "riscv64" ]; then
          export MUSL_PATH="riscv64-linux-musl-cross"
        fi
        wget https://musl.cc/$MUSL_PATH.tgz
        tar -xf $MUSL_PATH.tgz
        mv $MUSL_PATH musl
    - name: Build user and kernel
      run: |
        export PATH=$PATH:$PWD/musl/bin
        cd user && make ARCH=${{ matrix.arch }} build
        cd ../kernel && make build ARCH=${{ matrix.arch }} USER_ENTRY=${{ env.USER_ENTRY }} GICV3=${{ env.GICV3 }}
        cd ..
    - name: Archive
      run: zip -j -r ${{ env.ZIP_NAME }} kernel/target/${{ matrix.arch }}/release/nimbos.bin
    - name: Release
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: ${{ env.ZIP_NAME }}
